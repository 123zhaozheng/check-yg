<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>智行卫士 - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#1b1c1c",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#848484",
                        "inverse-surface": "#2f3031",
                        "tertiary-fixed": "#e2e2e2",
                        "background": "#faf9f9",
                        "primary-container": "#1b1b1b",
                        "on-secondary-container": "#636262",
                        "surface-container-low": "#f4f3f3",
                        "secondary-fixed": "#e4e2e2",
                        "surface-container-high": "#e9e8e8",
                        "on-tertiary-fixed-variant": "#474747",
                        "surface-tint": "#5e5e5e",
                        "on-tertiary-fixed": "#1b1b1b",
                        "secondary-fixed-dim": "#c7c6c6",
                        "on-surface": "#1b1c1c",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#848484",
                        "tertiary-fixed-dim": "#c6c6c6",
                        "on-primary-fixed": "#1b1b1b",
                        "on-surface-variant": "#4c4546",
                        "outline": "#7e7576",
                        "surface-variant": "#e3e2e2",
                        "tertiary": "#000000",
                        "on-primary-fixed-variant": "#474747",
                        "on-error-container": "#93000a",
                        "on-background": "#1b1c1c",
                        "inverse-on-surface": "#f2f0f0",
                        "primary-fixed-dim": "#c6c6c6",
                        "on-error": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#efeded",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#464747",
                        "surface-dim": "#dbdad9",
                        "surface": "#faf9f9",
                        "secondary": "#5e5e5e",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#c6c6c6",
                        "surface-bright": "#faf9f9",
                        "outline-variant": "#cfc4c5",
                        "tertiary-container": "#1b1b1b",
                        "primary": "#000000",
                        "surface-container-highest": "#e3e2e2",
                        "primary-fixed": "#e2e2e2",
                        "secondary-container": "#e1dfdf",
                        "on-tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-desktop": "40px",
                        "max-width": "1440px",
                        "unit": "4px",
                        "gutter": "24px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "label-caps": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "data-mono": ["JetBrains Mono"],
                        "title-sm": ["Hanken Grotesk"],
                        "body-sm": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "title-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "body-md": ["15px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fine-border-bottom {
            border-bottom: 1px solid #bfbfbf;
        }
        .fine-border-bottom:focus {
            border-bottom: 2px solid #000000;
            outline: none;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md h-screen w-full overflow-hidden flex flex-col md:flex-row">
<!-- Left Side: Brand Area (60%) -->
<div class="hidden md:flex w-[60%] bg-[#f7f7f8] flex-col justify-center items-start px-[10%] relative overflow-hidden">
<!-- Abstract Geometric Shield / Grid Graphic -->
<div class="absolute inset-0 z-0 opacity-10 pointer-events-none" style="background-image: linear-gradient(#e5e5e5 1px, transparent 1px), linear-gradient(90deg, #e5e5e5 1px, transparent 1px); background-size: 64px 64px;"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 border border-[#bfbfbf] rotate-45 z-0 opacity-20 pointer-events-none"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 border border-[#bfbfbf] rotate-45 z-0 opacity-30 pointer-events-none"></div>
<div class="relative z-10 max-w-lg">
<span class="material-symbols-outlined text-[64px] text-primary mb-8" style="font-variation-settings: 'FILL' 1;">shield</span>
<h1 class="font-display-lg text-display-lg text-primary mb-4 tracking-tight">智行卫士</h1>
<p class="font-title-sm text-title-sm text-on-surface-variant uppercase tracking-widest border-l-2 border-primary pl-4 py-1">流水审查 · 标准化 · 智能报告</p>
</div>
<div class="absolute bottom-12 left-[10%] font-data-mono text-data-mono text-on-surface-variant z-10 opacity-60">
            SYSTEM_VERSION: 2.4.1_BUILD_89<br/>
            SECURITY_LEVEL: OMEGA
        </div>
</div>
<!-- Right Side: Login Form (40%) -->
<div class="w-full md:w-[40%] bg-surface-container-lowest h-full flex flex-col justify-center items-center p-8 md:p-16 border-l border-outline-variant shadow-[-2px_0_10px_rgba(0,0,0,0.02)]">
<!-- Mobile Brand Header (Visible only on small screens) -->
<div class="md:hidden w-full flex flex-col items-center mb-12">
<span class="material-symbols-outlined text-[48px] text-primary mb-4" style="font-variation-settings: 'FILL' 1;">shield</span>
<h1 class="font-headline-md text-headline-md text-primary font-bold">智行卫士</h1>
</div>
<div class="w-full max-w-sm">
<h2 class="font-headline-md text-headline-md text-primary mb-8 font-bold text-left">Secure Login</h2>
<form class="space-y-8 flex flex-col">
<!-- Username Field -->
<div class="relative group">
<input class="w-full bg-transparent fine-border-bottom pb-2 pt-4 px-0 transition-all font-data-mono text-data-mono text-primary placeholder-[#8c8c8c]" id="username" placeholder="Auditor ID" required="" type="text"/>
</div>
<!-- Password Field -->
<div class="relative group">
<input class="w-full bg-transparent fine-border-bottom pb-2 pt-4 px-0 transition-all font-data-mono text-data-mono text-primary placeholder-[#8c8c8c]" id="password" placeholder="Passcode" required="" type="password"/>
<!-- Simulated Grayscale Error State (Hidden by default for visual cleanliness, uncomment to show) -->
<!-- <p class="text-xs text-[#595959] mt-2 font-data-mono">ERR: Invalid Credentials</p> -->
</div>
<div class="flex items-center justify-between pt-4">
<label class="flex items-center space-x-2 cursor-pointer">
<input class="form-checkbox h-4 w-4 text-primary border-outline rounded-none focus:ring-primary focus:ring-1 focus:ring-offset-0 bg-transparent" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant">Remember me</span>
</label>
<a class="font-body-sm text-body-sm text-primary underline hover:text-[#595959] transition-colors" href="#">Recover Access</a>
</div>
<button class="w-full bg-primary text-on-primary py-4 mt-8 font-title-sm text-title-sm hover:bg-[#1a1a1a] transition-colors flex items-center justify-center group" type="button">
                    Authenticate
                    <span class="material-symbols-outlined ml-2 opacity-0 group-hover:opacity-100 group-hover:translate-x-1 transition-all">arrow_forward</span>
</button>
</form>
<div class="mt-12 pt-8 border-t border-outline-variant w-full text-center">
<p class="font-label-caps text-label-caps text-[#8c8c8c] uppercase">Restricted Access Area. Authorized Personnel Only.</p>
</div>
</div>
</div>
</body></html>
