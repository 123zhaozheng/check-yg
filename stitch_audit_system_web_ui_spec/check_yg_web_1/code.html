<body class="flex flex-col items-center justify-center min-h-screen p-4 overflow-hidden">
<main class="w-full max-w-[400px] flex flex-col gap-8 animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Header Branding -->
<header class="flex flex-col items-center text-center gap-4">
<div class="size-12 bg-primary rounded-xl flex items-center justify-center shadow-lg shadow-primary/10">
<span class="material-symbols-outlined text-on-primary text-3xl" data-icon="account_balance">account_balance</span>
</div>
<div class="space-y-1">
<h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight">Check-YG Web</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">员工-客户金额往来审计系统</p>
</div>
</header>
<!-- Login Card -->
<section class="glass-card rounded-xl p-8 shadow-2xl">
<form class="flex flex-col gap-5" id="loginForm">
<!-- Username -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="username">用户名</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg" data-icon="person">person</span>
<input class="w-full bg-surface-container-low border border-border-dark rounded-lg py-2.5 pl-10 pr-4 text-on-surface font-body-sm placeholder:text-on-surface-variant/50 transition-all focus:border-primary/50 focus:ring-0" id="username" name="username" placeholder="请输入您的账号" required="" type="text"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">密码</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-low border border-border-dark rounded-lg py-2.5 pl-10 pr-10 text-on-surface font-body-sm placeholder:text-on-surface-variant/50 transition-all focus:border-primary/50 focus:ring-0" id="password" name="password" placeholder="********" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-lg" data-icon="visibility" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Action Links -->
<div class="flex items-center justify-between">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">忘记密码？</a>
<div class="group relative flex items-center gap-1">
<span class="font-label-sm text-label-sm text-on-surface-variant/40 cursor-not-allowed">通过邀请码注册</span>
<span class="material-symbols-outlined text-on-surface-variant/40 text-sm" data-icon="info">info</span>
<!-- Tooltip -->
<div class="absolute bottom-full right-0 mb-2 hidden group-hover:block bg-surface-container-highest text-on-surface text-[10px] py-1 px-2 rounded whitespace-nowrap shadow-xl border border-border-dark">
                        联系管理员获取邀请码
                    </div>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-3 rounded-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-2" type="submit">

<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.innerText = 'visibility_off';
        } else {
            passwordInput.type = 'password';
            eyeIcon.innerText = 'visibility';
        }
    }

    // Form submission micro-interaction
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = this.querySelector('button[type="submit"]');
        const originalContent = btn.innerHTML;
        
        btn.disabled = true;
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-lg" data-icon="progress_activity">progress_activity</span> 验证中...';
        
        // Artificial delay for feedback
        setTimeout(() => {
            btn.classList.add('bg-accent-positive');
            btn.innerHTML = '<span class="material-symbols-outlined text-lg" data-icon="check_circle">check_circle</span> 成功';
            setTimeout(() => {
                alert('欢迎回来。正在进入审计中心...');
                btn.disabled = false;
                btn.classList.remove('bg-accent-positive');
                btn.innerHTML = originalContent;
            }, 1000);
        }, 1500);
    });

    // Atmospheric visual effect
    document.addEventListener('mousemove', (e) => {
        const x = e.clientX / window.innerWidth;
        const y = e.clientY / window.innerHeight;
        document.body.style.background = `radial-gradient(circle at ${x * 100}% ${y * 100}%, #1a1a1a 0%, #0a0a0a 100%)`;
    });
</script>
